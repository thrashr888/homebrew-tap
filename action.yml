name: Update Homebrew Formula
description: Updates a formula or cask in thrashr888/homebrew-tap with new version and SHA256 sums

inputs:
  formula:
    description: Formula or cask name (e.g. cider, cortex, alchemy)
    required: true
  type:
    description: Definition type — "formula" (Formula/) or "cask" (Casks/)
    required: false
    default: formula
  tag:
    description: Git tag (e.g. v0.1.3). Version is derived by stripping the v prefix.
    required: true
  tap-token:
    description: GitHub PAT with repo scope for homebrew-tap
    required: true
  darwin-arm64-sha256:
    description: SHA256 of the darwin arm64 tarball
    required: false
    default: ""
  darwin-amd64-sha256:
    description: SHA256 of the darwin amd64/x86_64 tarball
    required: false
    default: ""
  linux-arm64-sha256:
    description: SHA256 of the linux arm64 tarball
    required: false
    default: ""
  linux-amd64-sha256:
    description: SHA256 of the linux amd64/x86_64 tarball
    required: false
    default: ""
  bridge-url:
    description: |
      URL of a notarized "Cider Bridge.app" + cider-bridge tarball to install alongside
      the binary (cider only). With bridge-sha256, fills the BRIDGE_RESOURCE, BRIDGE_INSTALL
      and BRIDGE_CAVEATS placeholders; when empty those placeholder lines are removed.
    required: false
    default: ""
  bridge-sha256:
    description: SHA256 of the bridge tarball
    required: false
    default: ""
  template:
    description: |
      Inline Ruby formula template with placeholders VERSION, TAG, SHA_DARWIN_ARM64,
      SHA_DARWIN_AMD64, SHA_LINUX_ARM64, SHA_LINUX_AMD64, and (each on its own line)
      BRIDGE_RESOURCE, BRIDGE_INSTALL, BRIDGE_CAVEATS
    required: true

runs:
  using: composite
  steps:
    - name: Generate formula
      shell: bash
      env:
        FORMULA_NAME: ${{ inputs.formula }}
        TAG: ${{ inputs.tag }}
        SHA_DARWIN_ARM64: ${{ inputs.darwin-arm64-sha256 }}
        SHA_DARWIN_AMD64: ${{ inputs.darwin-amd64-sha256 }}
        SHA_LINUX_ARM64: ${{ inputs.linux-arm64-sha256 }}
        SHA_LINUX_AMD64: ${{ inputs.linux-amd64-sha256 }}
        BRIDGE_URL: ${{ inputs.bridge-url }}
        BRIDGE_SHA256: ${{ inputs.bridge-sha256 }}
        TEMPLATE: ${{ inputs.template }}
      run: |
        VERSION="${TAG#v}"

        # The bridge blocks are multi-line, so every placeholder is filled
        # with bash substitution rather than sed. A BRIDGE_* placeholder
        # occupies a whole line in the template; without a bridge that line
        # goes away entirely.
        BRIDGE_RESOURCE=""
        BRIDGE_INSTALL=""
        BRIDGE_CAVEATS=""
        if [ -n "$BRIDGE_URL" ] && [ -n "$BRIDGE_SHA256" ]; then
          BRIDGE_RESOURCE=$(printf '  resource "bridge" do\n    url "%s"\n    sha256 "%s"\n  end\n' \
            "$BRIDGE_URL" "$BRIDGE_SHA256")$'\n\n'
          BRIDGE_INSTALL=$(printf '    resource("bridge").stage do\n      libexec.install "Cider Bridge.app"\n      bin.install "cider-bridge"\n    end')$'\n'
          BRIDGE_CAVEATS=$(printf '  def caveats\n    <<~EOS\n      Cider Bridge is installed for WeatherKit, Calendar, Reminders and Contacts.\n      Live HomeKit needs a personal build: cider bridge build --install\n      (Xcode + Apple Developer team)\n    EOS\n  end')$'\n\n'
        fi

        OUT="${TEMPLATE}"
        OUT="${OUT//\$\{VERSION\}/${VERSION}}"
        OUT="${OUT//\$\{TAG\}/${TAG}}"
        OUT="${OUT//\$\{SHA_DARWIN_ARM64\}/${SHA_DARWIN_ARM64}}"
        OUT="${OUT//\$\{SHA_DARWIN_AMD64\}/${SHA_DARWIN_AMD64}}"
        OUT="${OUT//\$\{SHA_LINUX_ARM64\}/${SHA_LINUX_ARM64}}"
        OUT="${OUT//\$\{SHA_LINUX_AMD64\}/${SHA_LINUX_AMD64}}"
        OUT="${OUT//\$\{BRIDGE_RESOURCE\}$'\n'/${BRIDGE_RESOURCE}}"
        OUT="${OUT//\$\{BRIDGE_INSTALL\}$'\n'/${BRIDGE_INSTALL}}"
        OUT="${OUT//\$\{BRIDGE_CAVEATS\}$'\n'/${BRIDGE_CAVEATS}}"
        printf '%s\n' "${OUT%$'\n'}" > "${FORMULA_NAME}.rb"
        echo "Generated formula:"
        cat "${FORMULA_NAME}.rb"

    - name: Push to homebrew-tap
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.tap-token }}
        FORMULA_NAME: ${{ inputs.formula }}
        TYPE: ${{ inputs.type }}
        TAG: ${{ inputs.tag }}
      run: |
        case "$TYPE" in
          formula) DEST_DIR="Formula" ;;
          cask)    DEST_DIR="Casks" ;;
          *) echo "Unknown type '$TYPE' (expected formula or cask)" >&2; exit 1 ;;
        esac
        git clone "https://x-access-token:${GH_TOKEN}@github.com/thrashr888/homebrew-tap.git" /tmp/homebrew-tap
        mkdir -p "/tmp/homebrew-tap/${DEST_DIR}"
        cp "${FORMULA_NAME}.rb" "/tmp/homebrew-tap/${DEST_DIR}/${FORMULA_NAME}.rb"
        cd /tmp/homebrew-tap
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add "${DEST_DIR}/${FORMULA_NAME}.rb"
        git diff --cached --quiet && echo "No changes" && exit 0
        git commit -m "Update ${FORMULA_NAME} to ${TAG}"
        git push
